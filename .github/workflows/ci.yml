name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MAJOR: 5
      MINOR: 0
      PATCH: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check task script
        run: node --check ElmahIoDeploymentNotification/index.js

      - name: Set version in vss-extension.json and task.json
        run: |
          echo "VERSION=$MAJOR.$MINOR.$PATCH" >> "$GITHUB_ENV"
          node - <<'EOF'
          const fs = require("fs");
          const read = (p) => {
            const text = fs.readFileSync(p, "utf8");
            return JSON.parse(text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text);
          };

          const extension = read("vss-extension.json");
          extension.version = `${process.env.MAJOR}.${process.env.MINOR}.${process.env.PATCH}`;
          fs.writeFileSync("vss-extension.json", JSON.stringify(extension, null, 2));

          const task = read("ElmahIoDeploymentNotification/task.json");
          task.version = {
            Major: Number(process.env.MAJOR),
            Minor: Number(process.env.MINOR),
            Patch: Number(process.env.PATCH),
          };
          fs.writeFileSync("ElmahIoDeploymentNotification/task.json", JSON.stringify(task, null, 2));
          EOF

      - name: Build vsix
        run: npx --yes tfx-cli@0.24.2 extension create --manifest-globs vss-extension.json

      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: elmahio.deploy-tasks-${{ env.VERSION }}.vsix

      - name: Create the release
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$VERSION"
          "elmahio.deploy-tasks-$VERSION.vsix"
          --target "$GITHUB_SHA"
          --title "Release $VERSION"
          --generate-notes
